name: Build Mobile Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-release.yml"

concurrency:
  group: mobile-release-foco-academia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build APK e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # O Cloudflare (Bot Fight Mode) devolve 403 para IPs do GitHub Actions.
      # Por isso a API é acessada por túnel SSH até o nginx do Hetzner.
      API_URL: http://127.0.0.1:18088

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Abrir túnel SSH para a API
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          if [ -z "$HETZNER_SSH_KEY" ] || [ -z "$HETZNER_HOST" ]; then
            echo "Defina HETZNER_SSH_KEY e HETZNER_HOST nos secrets do repositorio."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -f -N -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -o TCPKeepAlive=yes \
            -L 18088:127.0.0.1:8088 "${HETZNER_USER:-root}@${HETZNER_HOST}"
          echo "Túnel SSH aberto em 127.0.0.1:18088 -> servidor:8088"

      - name: Aguardar API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${API_URL}/api/health" >/dev/null; then
              echo "API disponível."
              exit 0
            fi
            echo "Aguardando API (${i}/30)..."
            sleep 15
          done
          echo "API indisponível após 7 minutos."
          exit 1

      - name: Ajustar versionCode
        id: version
        working-directory: mobile
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${VERSION_LINE%%+*}"
          CODE="${VERSION_LINE##*+}"
          BUMPED=false
          PUBLISHED=0
          if RESP=$(curl -fsS "${API_URL}/api/app/version" 2>/dev/null); then
            PUBLISHED=$(echo "$RESP" | sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -n1)
            PUBLISHED="${PUBLISHED:-0}"
          fi
          if [ "$CODE" -le "$PUBLISHED" ]; then
            CODE=$((PUBLISHED + 1))
            BUMPED=true
            sed -i "s/^version: .*/version: ${NAME}+${CODE}/" pubspec.yaml
            printf '%s\n' \
              '/// Versão exibida/enviada à API — manter alinhada com pubspec.yaml.' \
              'class AppVersion {' \
              "  static const String value = '${NAME}+${CODE}';" \
              '}' \
              > lib/core/config/app_version.dart
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "bumped=${BUMPED}" >> "$GITHUB_OUTPUT"

      - name: Commit bump de versão
        if: steps.version.outputs.bumped == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/pubspec.yaml mobile/lib/core/config/app_version.dart
          git commit -m "chore(mobile): bump versionCode para ${{ steps.version.outputs.code }} [skip ci]"
          git pull --rebase -X theirs origin main
          git push origin main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Configurar assinatura release Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] \
            || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "ERRO: configure os secrets ANDROID_KEYSTORE_* no GitHub."
            echo "Execute: bash scripts/setup-android-release-signing.sh"
            exit 1
          fi
          KEYSTORE_PATH="mobile/android/app/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > mobile/android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Build APK release
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Build AAB (Google Play)
        run: |
          set -euo pipefail
          bash scripts/prepare-play-manifest.sh
          cd mobile
          flutter build appbundle --release --dart-define=PLAY_STORE=true
          cd ..
          git checkout -- mobile/android/app/src/main/AndroidManifest.xml

      - name: Guardar AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: foco-academia-aab-${{ steps.version.outputs.code }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publicar APK na API
        env:
          DEPLOY_TOKEN: ${{ secrets.APP_RELEASE_DEPLOY_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "Defina APP_RELEASE_DEPLOY_TOKEN no GitHub."
            echo "Execute: bash scripts/setup-github-mobile-release-secret.sh"
            exit 1
          fi
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          SHORT_MSG=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-180)
          NOTES="Deploy automático ${COMMIT_SHA:0:7} — ${SHORT_MSG}"
          for i in $(seq 1 12); do
            if curl -fsS "${API_URL}/api/health" >/dev/null \
              && curl -fsS -X POST "${API_URL}/api/app/releases/deploy" \
                -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
                -F "file=@${APK}" \
                -F "versionName=${VERSION_NAME}" \
                -F "versionCode=${VERSION_CODE}" \
                -F "releaseNotes=${NOTES}"; then
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "Falha ao publicar APK após 12 tentativas."
              exit 1
            fi
            echo "Tentativa ${i} falhou; aguardando 30s..."
            sleep 30
          done

      - name: Resumo
        run: |
          echo "APK publicado: ${{ steps.version.outputs.name }} (+${{ steps.version.outputs.code }})"

      - name: Verificar versão publicada
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          RESP=$(curl -fsS "${API_URL}/api/app/version")
          echo "$RESP"
          PUBLISHED=$(echo "$RESP" | sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -n1)
          if [ "$PUBLISHED" != "$VERSION_CODE" ]; then
            echo "Esperado versionCode ${VERSION_CODE}, obtido ${PUBLISHED}."
            exit 1
          fi

      # Envio automático para a Play (teste fechado `alpha`). Só roda quando o secret
      # PLAY_SERVICE_ACCOUNT_JSON existe; sem ele o AAB continua só como artefato (envio manual).
      # Fica por último para uma falha da Play não impedir a publicação do APK na API.
      - name: Checar chave da Play
        id: play
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret PLAY_SERVICE_ACCOUNT_JSON ausente: AAB não enviado à Play (suba manualmente)."
          fi

      - name: Enviar AAB para a Play (teste fechado)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.focodev.academia.aluno
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed
