name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes
        working-directory: api
        run: ./mvnw -B -q test

  web:
    name: PWA ${{ matrix.app }} (lint, tipos, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [aluno, instrutor, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Instalar dependências
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npx eslint . --max-warnings 0
      - name: Tipos
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  mobile:
    name: Mobile (analyze, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependências
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Testes
        working-directory: mobile
        run: flutter test
