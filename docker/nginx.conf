events {
    worker_connections 1024;
}

http {
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Evita Location: http://... quando o nginx escuta em :80 atrás do túnel HTTPS.
    absolute_redirect off;
    port_in_redirect off;

    upstream api {
        server api:8080;
    }
    upstream aluno {
        server aluno:3000;
    }
    upstream instrutor {
        server instrutor:3000;
    }
    upstream admin {
        server admin:3000;
    }

    server {
        listen 80;
        server_name instrutor-academia.focodev.com.br;

        client_max_body_size 150M;

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location / {
            proxy_pass http://instrutor;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }

    server {
        listen 80 default_server;
        server_name academia.focodev.com.br _;

        client_max_body_size 150M;

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /admin/ {
            return 301 /admin;
        }

        location /admin {
            proxy_pass http://admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /instrutor {
            return 301 https://instrutor-academia.focodev.com.br/;
        }

        location ~ ^/instrutor/(.*)$ {
            return 301 https://instrutor-academia.focodev.com.br/$1;
        }

        location / {
            proxy_pass http://aluno;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
